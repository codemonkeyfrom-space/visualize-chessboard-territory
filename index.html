<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cm-chessboard</title>
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0"/>
    
    <link rel="stylesheet" href="./node_modules/cm-chessboard/examples/styles/examples.css"/>
    <link rel="stylesheet" href="./node_modules/cm-chessboard/assets/chessboard.css"/>
    <link rel="stylesheet" href="./node_modules/cm-chessboard/assets/extensions/markers/markers.css"/>
    <link rel="stylesheet" href="./node_modules/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css"/>
</head>
<body>

<h1><a href="./node_modules/cm-chessboard/">cm-chessboard</a></h1>
<div class="board board-large" id="board"></div>
<div id="output"></div>
<div style="clear: both"></div>
<script type="module">
    import {INPUT_EVENT_TYPE, COLOR, Chessboard, BORDER_TYPE} from "./node_modules/cm-chessboard/src/Chessboard.js"
    import {Accessibility} from "./node_modules/cm-chessboard/src/extensions/accessibility/Accessibility.js"
    import {PROMOTION_DIALOG_RESULT_TYPE, PromotionDialog} from "./node_modules/cm-chessboard/src/extensions/promotion-dialog/PromotionDialog.js"
    import {FEN} from "./node_modules/cm-chessboard/src/model/Position.js"
    import {ARROW_TYPE, Arrows} from "./node_modules/cm-chessboard/src/extensions/arrows/Arrows.js"
    import {MARKER_TYPE, Markers} from "./node_modules/cm-chessboard/src/extensions/markers/Markers.js"
    import {Chess, SQUARES} from "./node_modules/chess.js/dist/esm/chess.js"
 
    const chess = new Chess();
    let seed = 71;
    function random() {
        const x = Math.sin(seed++) * 10000;
        const result = x - Math.floor(x);
        console.log("random result with seed " + seed + ": " + result);
        return result;
    }

    function showSquareOwnership(chessboard) {
        const squares = SQUARES;
        squares.forEach(square => {
            const blackAttackers = chess.attackers(square, 'b');
            const whiteAttackers = chess.attackers(square, 'w');

            console.log(square + "attackers: " + whiteAttackers.length + ", " + blackAttackers.length);
            if (blackAttackers.length > whiteAttackers.length){
                setSquareBorder(square, "blue", blackAttackers.length);
            }
            if (whiteAttackers.length > blackAttackers.length ){
                setSquareBorder(square, "red", whiteAttackers.length);
            }
        });
    }

    function setPosition(chessboard, fen, truth) {
        console.log('setPosition');
        chessboard.setPosition(fen, truth);
        showSquareOwnership(chessboard);
    }

    function makeEngineMove(chessboard) {
        const possibleMoves = chess.moves({verbose: true});
        if (possibleMoves.length > 0){
            const randomIndex = Math.floor(random() * possibleMoves.length)
            const randomMove = possibleMoves[randomIndex]
            setTimeout(() => {
                chess.move({from: randomMove.from, to: randomMove.to});
                setPosition(chessboard, chess.fen(), true);
                chessboard.enableMoveInput(inputHandler, COLOR.white)
            })
        }
    }

    function setSquareBorder(square, color, width){
        const squares = document.querySelectorAll("rect[data-square='" + square + "']");
        squares.forEach(element => {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            // Set the circle's attributes
            circle.setAttribute('cx', element.cx); // Center x-coordinate
            circle.setAttribute('cy', element.cy); // Center y-coordinate
            circle.setAttribute('r', element.width/2);   // Radius
            circle.setAttribute('fill', 'red'); // Fill color
            element.parentElement.appendChild(circle);
            element.style["stroke"]=color;
            element.style["stroke-width"]=width; 
        });
    }

    function inputHandler(event) {
        console.log("inputHandler", event)
        if(event.type === INPUT_EVENT_TYPE.movingOverSquare) {
            return // ignore this event
        }
        if(event.type !== INPUT_EVENT_TYPE.moveInputFinished) {
            event.chessboard.removeLegalMovesMarkers()
        }
        if (event.type === INPUT_EVENT_TYPE.moveInputStarted) {
            // mark legal moves
            const moves = chess.moves({square: event.squareFrom, verbose: true})
            event.chessboard.addLegalMovesMarkers(moves)
            return moves.length > 0
        } else if (event.type === INPUT_EVENT_TYPE.validateMoveInput) {
            const move = {from: event.squareFrom, to: event.squareTo, promotion: event.promotion}
            const result = chess.move(move)
            if (result) {
                event.chessboard.state.moveInputProcess.then(() => { // wait for the move input process has finished
                    event.chessboard.setPosition(chess.fen(), true).then(() => { // update position, maybe castled and wait for animation has finished
                        makeEngineMove(event.chessboard);
                    })
                })
            } else {
                // promotion?
                let possibleMoves = chess.moves({square: event.squareFrom, verbose: true})
                for (const possibleMove of possibleMoves) {
                    if (possibleMove.promotion && possibleMove.to === event.squareTo) {
                        event.chessboard.showPromotionDialog(event.squareTo, COLOR.white, (result) => {
                            console.log("promotion result", result)
                            if (result.type === PROMOTION_DIALOG_RESULT_TYPE.pieceSelected) {
                                chess.move({from: event.squareFrom, to: event.squareTo, promotion: result.piece.charAt(1)});
                                setPosition(event.chessboard, chess.fen(), true);
                                makeEngineMove(event.chessboard);
                            } else {
                                // promotion canceled
                                event.chessboard.enableMoveInput(inputHandler, COLOR.white);
                                setPosition(event.chessboard, chess.fen(), true);
                            }
                        })
                        return true
                    }
                }
            }
            return result
        } else if (event.type === INPUT_EVENT_TYPE.moveInputFinished) {
            if(event.legalMove) {
                event.chessboard.disableMoveInput()
            }
        }
    }

    const board = new Chessboard(document.getElementById("board"), {
        position: chess.fen(),
        assetsUrl: "./node_modules/cm-chessboard/assets/",
        style: {borderType: BORDER_TYPE.none, pieces: {file: "pieces/staunty.svg"}, animationDuration: 300},
        orientation: COLOR.white,
        extensions: [
            {class: Markers, props: {autoMarkers: MARKER_TYPE.square}},
            {class: Arrows},
            {class: PromotionDialog},
            {class: Accessibility, props: {visuallyHidden: true}}
        ]
    });
    showSquareOwnership(board);
    board.enableMoveInput(inputHandler, COLOR.white);
</script>
</body>
</html>
