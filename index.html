<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cm-chessboard</title>
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0"/>
    <link rel="stylesheet" href="./node_modules/cm-chessboard/examples/styles/examples.css"/>
    <link rel="stylesheet" href="./node_modules/cm-chessboard/assets/chessboard.css"/>
    <link rel="stylesheet" href="./node_modules/cm-chessboard/assets/extensions/markers/markers.css"/>
</head>
<body>
<h1><a href="./node_modules/cm-chessboard/">cm-chessboard</a></h1>
<h2>Example: Markers Extension with pointer input</h2>
<p>Use left and right click to create markers on the boards. The second board shows the usage of autoMarkers, when moving a piece.</p>
<div class="board" id="dotBoard"></div>
<div class="board" id="moveBoard"></div>
<div style="clear: both"></div>
<button onclick="window.removeDots()">Remove dots</button>
<script type="module">
    import {Chessboard} from "./node_modules/cm-chessboard/src/Chessboard.js"
    import {FEN} from "./node_modules/cm-chessboard/src/model/Position.js"
    import {MARKER_TYPE, Markers} from "./node_modules/cm-chessboard/src/extensions/markers/Markers.js"

    const dotBoard = new Chessboard(document.getElementById("dotBoard"), {
        position: FEN.start,
        assetsCache: false,
        assetsUrl: "./node_modules/cm-chessboard/assets/",
        extensions: [{class: Markers}]
    })
    dotBoard.context.addEventListener("contextmenu", (event) => {
        event.preventDefault()
    })
    dotBoard.context.addEventListener("mousedown", (event) => {
        console.log("mousedown dotBoard", event)
        let markerType
        if (event.button === 0) {
            markerType = MARKER_TYPE.dot
        } else {
            markerType = MARKER_TYPE.circlePrimary
        }
        const square = event.target.getAttribute("data-square")
        const markersOnSquare = dotBoard.getMarkers(markerType, square)
        if (markersOnSquare.length > 0) {
            dotBoard.removeMarkers(markerType, square)
        } else {
            dotBoard.addMarker(markerType, square)
        }
    })
    window.removeDots = () => {
        dotBoard.removeMarkers(MARKER_TYPE.dot)
    }
    const moveBoard = new Chessboard(document.getElementById("moveBoard"), {
        position: "rn2k1r1/ppp1pp1p/3p2p1/5bn1/P7/2N2B2/1PPPPP2/2BNK1RR",
        assetsUrl: "./node_modules/cm-chessboard/assets/",
        style: {pieces: {file: "pieces/staunty.svg"}},
        extensions: [{class: Markers, autoMarkers: MARKER_TYPE.frame}]
    })
    moveBoard.enableMoveInput(() => {
        return true
    })
    const marker = {class: "marker-circle-danger", slice: "markerCircle"}
    moveBoard.context.addEventListener("contextmenu", (event) => {
        event.preventDefault()
    })
    moveBoard.context.addEventListener("mousedown", (event) => {
        if (event.button === 2) {
            const square = event.target.getAttribute("data-square")
            const markersOnSquare = moveBoard.getMarkers(marker, square)
            if (markersOnSquare.length > 0) {
                moveBoard.removeMarkers(marker, square)
            } else {
                moveBoard.addMarker(marker, square)
            }
        }
    })
</script>
</body>
</html>
